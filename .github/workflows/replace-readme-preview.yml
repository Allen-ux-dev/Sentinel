# One-time workflow. Remove after the verified preview is committed.
name: Replace README preview once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-readme-preview.yml'

permissions:
  contents: write

jobs:
  replace-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified high-quality preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://tmpfiles.org/dl/1788139423.354ad12b03887c3d/wIwIswM6uOlz/sentinel-lock-screen.webp'
          expected='cd9201a77ae6a82d282ad9f789433a3b7fc4925d922f5ff9a80d9026d475e2dc'
          curl --fail --location --silent --show-error "$url" -o /tmp/Sentinel-Lock-Screen.webp
          actual="$(sha256sum /tmp/Sentinel-Lock-Screen.webp | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(stat -c%s /tmp/Sentinel-Lock-Screen.webp)" -gt 150000
          mkdir -p Resources
          mv /tmp/Sentinel-Lock-Screen.webp Resources/Sentinel-Lock-Screen.webp

      - name: Commit high-quality preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Resources/Sentinel-Lock-Screen.webp
          if git diff --cached --quiet; then
            echo 'Preview is already up to date.'
            exit 0
          fi
          git commit -m 'docs: replace lock screen preview with high-quality image'
          git push origin HEAD:main
